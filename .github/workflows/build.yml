name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Eski artifact'leri temizle — derlemeden önce yer açılsın
      - name: Eski artifact'leri temizle
        uses: actions/github-script@v7
        continue-on-error: true
        with:
          script: |
            let page = 1;
            const artifacts = [];
            while (true) {
              const res = await github.rest.actions.listArtifactsForRepo({
                owner: context.repo.owner,
                repo: context.repo.repo,
                per_page: 100,
                page,
              });
              if (res.data.artifacts.length === 0) break;
              artifacts.push(...res.data.artifacts);
              page++;
            }
            for (const artifact of artifacts) {
              if (artifact.workflow_run && artifact.workflow_run.id === context.runId) continue;
              await github.rest.actions.deleteArtifact({
                owner: context.repo.owner,
                repo: context.repo.repo,
                artifact_id: artifact.id,
              });
            }

      - name: Java kur
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Flutter kur
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Android platform iskeletini oluştur (yoksa)
        run: |
          if [ ! -d android ]; then
            flutter create --platforms=android --org com.demir --project-name auth2fa .
          fi

      - name: Keystore'u geri yükle (varsa)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "KEYSTORE_BASE64 secret'ı yok — debug imzasıyla devam edilecek."
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/release.keystore
          cat > android/key.properties <<EOF
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=release.keystore
          EOF

      - name: Android yamalarını uygula (kamera izni + imzalama)
        run: bash scripts/patch_android.sh

      - name: Bağımlılıkları al
        run: flutter pub get

      - name: APK derle (release)
        run: flutter build apk --release

      - name: APK'yı yükle
        uses: actions/upload-artifact@v4
        with:
          name: auth2fa-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 5
          compression-level: 0
