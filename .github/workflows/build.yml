name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Java kur
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Flutter kur
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Android platform iskeletini oluştur (yoksa)
        run: |
          if [ ! -d android ]; then
            flutter create --platforms=android --org com.demir --project-name auth2fa .
          fi

      - name: Keystore'u geri yükle (varsa)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "KEYSTORE_BASE64 secret'ı yok — debug imzasıyla devam edilecek."
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/release.keystore
          cat > android/key.properties <<EOF
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=release.keystore
          EOF

      - name: Android yamalarını uygula (kamera izni + imzalama)
        run: bash scripts/patch_android.sh

      - name: Bağımlılıkları al
        run: flutter pub get

      - name: APK derle (release)
        run: flutter build apk --release

      - name: APK'yı yeniden adlandır
        run: |
          mkdir -p release_out
          cp build/app/outputs/flutter-apk/app-release.apk \
             "release_out/auth2fa-build${{ github.run_number }}.apk"

      # Artifact yerine doğrudan Releases'e koy — apk zip'e sarılmadan
      # tek dosya olarak iner, telefon depolamasını şişirmez.
      - name: Release oluştur ve APK'yı ekle
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: "auth2fa build #${{ github.run_number }}"
          files: release_out/*.apk
          make_latest: true

      # Eski release'ler birikmesin diye yalnızca son 3'ü tut
      - name: Eski release'leri temizle
        uses: actions/github-script@v7
        continue-on-error: true
        with:
          script: |
            const releases = await github.rest.repos.listReleases({
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100,
            });
            const toDelete = releases.data
              .sort((a, b) => new Date(b.created_at) - new Date(a.created_at))
              .slice(3);
            for (const r of toDelete) {
              await github.rest.repos.deleteRelease({
                owner: context.repo.owner,
                repo: context.repo.repo,
                release_id: r.id,
              });
              await github.rest.git.deleteRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: `tags/${r.tag_name}`,
              }).catch(() => {});
            }
