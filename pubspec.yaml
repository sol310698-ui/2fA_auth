name: auth2fa
description: Kendi 2FA (TOTP/HOTP) kimlik doğrulayıcı uygulaman.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_secure_storage: ^9.2.2
  mobile_scanner: ^5.2.3
  crypto: ^3.0.3
  base32: ^2.1.3
  qr_flutter: ^4.1.0
  uuid: ^4.4.0
  provider: ^6.1.2
  flutter_animate: ^4.5.2
  local_auth: ^2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
